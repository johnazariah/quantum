announcements:
  - id: circuit-bench-launch
    date: 2026-07-31
    title: Circuit Bench
    url: https://johnazariah.github.io/quantum/circuit-bench/
    linkedin: |
      The Bottleneck posts keep reaching a point where I want to stop, point at three gates, and explain what they are doing. That would ruin the pace of every post, so I built somewhere else to do it.

      Circuit Bench is now open: thirteen small, self-contained circuit notes, from reading a circuit and preparing a Bell state through teleportation, Grover, QAOA, VQE, the quantum Fourier transform, phase estimation, error mitigation and quantum counting.

      Each note has one teaching job. You get a circuit diagram, the OpenQASM program, the expected output, and an explanation of what each gate contributes. No framework gets to hide the machinery.

      I built it as the reference shelf beside The Quantum Bottleneck. When a post reaches a circuit, you can step sideways, inspect the mechanism, and return to the application.

      All thirteen notes are live.

      #QuantumComputing #Education
    bluesky: >-
      The Bottleneck posts keep reaching a point where I want to stop and explain three gates. Circuit Bench is where I do it: 13 self-contained notes with diagrams, OpenQASM, expected output, and a gate-by-gate explanation.

  - id: quantum-bottleneck-roundup
    date: 2026-08-21
    title: The Quantum Bottleneck
    url: https://johnazariah.github.io/quantum/bottleneck/
    linkedin: |
      The Quantum Bottleneck is complete.

      I began with a delivery route because it made the stakes obvious, and a three-node triangle because it kept QAOA small enough to inspect. Since then, the series has factored 15 without pretending we built Shor at scale; run VQE on H2 without calling it drug discovery; watched a quantum kernel tie its classical rival; kept option pricing classical; built a tiny nurse roster; separated Hubbard diagonalisation from compiled phase readout; and ended by giving quantum embedding a bounded job in catalyst modelling.

      Every post has a runnable notebook. Circuit Bench sits beside the series when you want to stop at the gates.

      All eight posts:

      1. The $50M Delivery Route
      https://johnazariah.github.io/quantum/blog/2026/07/27/the-50m-delivery-route/

      2. The Trapdoor
      https://johnazariah.github.io/quantum/blog/2026/07/29/the-trapdoor/

      3. The $2B Molecule
      https://johnazariah.github.io/quantum/blog/2026/08/03/the-2b-molecule/

      4. The Feature Explosion
      https://johnazariah.github.io/quantum/blog/2026/08/05/the-feature-explosion/

      5. The Convergence Wall
      https://johnazariah.github.io/quantum/blog/2026/08/10/the-convergence-wall/

      6. The Scheduling Nightmare
      https://johnazariah.github.io/quantum/blog/2026/08/12/the-scheduling-nightmare/

      7. The Materials Maze
      https://johnazariah.github.io/quantum/blog/2026/08/17/the-materials-maze/

      8. The Catalyst Bottleneck
      https://johnazariah.github.io/quantum/blog/2026/08/19/the-catalyst-bottleneck/

      I wanted each toy result to keep its boundary visible. A small circuit should teach us something useful without pretending that the industrial problem has vanished.

      #QuantumComputing #QuantumAlgorithms
